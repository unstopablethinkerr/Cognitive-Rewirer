<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Rewirer - Neuroplasticity Game</title>
    <style>
        :root { 
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --btn-bg: #334155;
            --correct-glow: rgba(34, 197, 94, 0.6);
            --wrong-glow: rgba(239, 68, 68, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.2s ease;
        }

        #game-container {
            background-color: var(--panel-bg);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
            transition: box-shadow 0.2s ease;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-blue);
            margin-top: 0;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        #rule-box {
            font-size: 1.25rem;
            font-weight: 700;
            background-color: var(--btn-bg);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        #target-word {
            font-size: 4rem;
            font-weight: 900;
            margin: 2rem 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: var(--btn-bg);
            color: var(--text-main);
            transition: transform 0.1s, background-color 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #475569;
        }

        button:active {
            transform: scale(0.95);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            color: #cbd5e1;
            font-weight: 600;
        }

        /* Feedback Animations */
        .flash-correct {
            box-shadow: 0 0 40px var(--correct-glow) !important;
        }
        
        .flash-wrong {
            box-shadow: 0 0 40px var(--wrong-glow) !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Cognitive Rewirer</h1>
        <p class="subtitle">Adapt to the changing rules to build new neural pathways.</p>

        <div id="rule-box">Loading...</div>
        
        <div id="target-word">WORD</div>
        
        <div class="options-grid" id="options-grid">
            <!-- Buttons generated by JS -->
        </div>

        <div class="stats">
            <span>Score: <span id="score-val" style="color: #38bdf8;">0</span></span>
            <span>Multiplier: x<span id="streak-val" style="color: #22c55e;">1</span></span>
        </div>
    </div>

    <script>
        // Game Data
        const words = ['Red', 'Blue', 'Green', 'Yellow'];
        
        // Hex codes corresponding to the words above
        const colors = [
            { name: 'Red', hex: '#ef4444' },
            { name: 'Blue', hex: '#3b82f6' },
            { name: 'Green', hex: '#22c55e' },
            { name: 'Yellow', hex: '#eab308' }
        ];

        // State variables
        let currentRule = 0; // 0 = Match Word Meaning, 1 = Match Font Color
        let currentWordIndex = 0;
        let currentColorIndex = 0;
        let score = 0;
        let streak = 0;

        // DOM Elements
        const ruleBox = document.getElementById('rule-box');
        const targetWordEl = document.getElementById('target-word');
        const optionsGrid = document.getElementById('options-grid');
        const scoreVal = document.getElementById('score-val');
        const streakVal = document.getElementById('streak-val');
        const container = document.getElementById('game-container');

        function initGame() {
            score = 0;
            streak = 0;
            updateStats();
            generateRound();
        }

        function generateRound() {
            // 1. Randomize the rule (50/50 chance)
            currentRule = Math.random() > 0.5 ? 1 : 0;
            
            // 2. Pick a random word and a random color
            currentWordIndex = Math.floor(Math.random() * words.length);
            currentColorIndex = Math.floor(Math.random() * colors.length);

            // 3. Update the UI based on the new state
            if (currentRule === 0) {
                ruleBox.innerText = "RULE: Match the WORD";
                ruleBox.style.borderColor = "#f8fafc";
                ruleBox.style.color = "#f8fafc";
            } else {
                ruleBox.innerText = "RULE: Match the COLOR";
                ruleBox.style.borderColor = "#eab308";
                ruleBox.style.color = "#eab308";
            }

            targetWordEl.innerText = words[currentWordIndex];
            targetWordEl.style.color = colors[currentColorIndex].hex;

            renderButtons();
        }

        function renderButtons() {
            optionsGrid.innerHTML = ''; // Clear old buttons
            
            words.forEach((word, index) => {
                const btn = document.createElement('button');
                btn.innerText = word;
                btn.onclick = () => handleAnswer(index);
                optionsGrid.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex) {
            let isCorrect = false;

            // Check logic based on current active rule
            if (currentRule === 0) {
                // Rule: Match the WORD meaning
                isCorrect = (selectedIndex === currentWordIndex);
            } else {
                // Rule: Match the FONT COLOR
                isCorrect = (selectedIndex === currentColorIndex);
            }

            if (isCorrect) {
                // Neuroplasticity reward!
                streak++;
                let points = 10 * streak;
                score += points;
                flashFeedback('flash-correct');
            } else {
                // Pathway error! Reset streak.
                streak = 0;
                flashFeedback('flash-wrong');
                score = Math.max(0, score - 15); // Small penalty
            }

            updateStats();
            
            // Short delay before next round so they can see the flash
            setTimeout(generateRound, 250); 
        }

        function flashFeedback(className) {
            container.classList.add(className);
            setTimeout(() => {
                container.classList.remove(className);
            }, 300);
        }

        function updateStats() {
            scoreVal.innerText = score;
            streakVal.innerText = streak > 0 ? streak : 1;
        }

        // Start the game on load
        initGame();

    </script>
</body>
</html>
